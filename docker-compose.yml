services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: NOME_DO_BANCO
      POSTGRES_USER: BD_USER
      POSTGRES_PASSWORD: BD_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
